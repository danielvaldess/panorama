<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>SWEETCODE · hackIAthon sandbox</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif; color: #e8eefc;
      background: radial-gradient(900px 500px at 20% -10%, #16233f, #0b1220 60%); }
    .card { text-align: center; padding: 40px 48px; border: 1px solid #26324f;
      border-radius: 20px; background: #111a2e; box-shadow: 0 20px 50px rgba(0,0,0,.35); max-width: 560px; }
    h1 { margin: 0 0 6px; font-size: 24px; color: #2dd4bf; letter-spacing: .5px; }
    p { margin: 6px 0; color: #93a2c4; }
    .tag { display: inline-block; margin-top: 16px; padding: 6px 14px; border-radius: 999px;
      background: rgba(45,212,191,.12); color: #2dd4bf; font-size: 13px; font-weight: 600; }
    code { color: #38bdf8; }
  </style>
</head>
<body>
  <main class="card">
    <h1>SWEETCODE · hackIAthon 2026</h1>
    <p>Entorno desplegado con <b>Dokku</b> (git push → build → deploy).</p>
    <p>Repositorio: <code>hackathon-sandbox</code></p>
    <span class="tag">Sandbox listo · auto-deploy activo</span>
  </main>
</body>
</html>
